global:
   scrape_interval: 15s
   evaluation_interval: 15s

scrape_configs:
   - job_name: 'prometheus'
     static_configs:
        - targets: ['prf-devops-quiz-prometheus:9090']

   - job_name: 'prf-devops-quiz-server'
     scrape_interval: 5s
     metrics_path: /api/metrics
     static_configs:
        - targets: ['localhost']
