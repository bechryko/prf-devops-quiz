user nginx;
worker_processes 1;

error_log /var/log/nginx/error.log debug;

events {}

http {
   resolver 127.0.0.11 ipv6=off;

   server {
      listen 80;

      set $client_upstream http://prf-devops-quiz-client:80;
      set $server_upstream http://prf-devops-quiz-server:5000;

      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|map)$ {
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

         proxy_pass $client_upstream;
      }

      location / {
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

         proxy_pass $client_upstream;
      }

      location /api/ {
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

         proxy_pass $server_upstream;
      }
   }
}
