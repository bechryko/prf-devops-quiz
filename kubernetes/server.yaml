apiVersion: apps/v1
kind: Deployment
metadata:
   name: prf-devops-quiz-server
spec:
   replicas: 1
   selector:
      matchLabels:
         app: prf-devops-quiz-server
   template:
      metadata:
         labels:
            app: prf-devops-quiz-server
      spec:
         containers:
            - name: prf-devops-quiz-server
              image: prf-devops-quiz-server
              imagePullPolicy: Never
              ports:
                 - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
   name: prf-devops-quiz-server
spec:
   selector:
      app: prf-devops-quiz-server
   ports:
      - port: 5000
        targetPort: 5000
